[paths]
src_dir     = ../src
dist_dir    = ../dist
out_dir     = ../out
tests_dir   = ../tests

[image]
floppy_size_kb  = 1440
floppy_image    = %(out_dir)s/nosdos.img
iso_image       = %(out_dir)s/nosdos.iso

[hdd]
# FAT16 hard disk image — created by mkhdd.py, attached to QEMU as C: drive
# Geometry: 64 cyl x 16 heads x 63 spt = 64512 sectors = 31.5 MB usable
hdd_image       = %(out_dir)s/nosdos.hdd

[freedos]
# FreeDOS 1.3 package base URL (ibiblio repositories mirror)
base_url        = https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/repositories/1.3/base
kernel_pkg      = kernel.zip
freecom_pkg     = freecom.zip
fdisk_pkg       = fdisk.zip
format_pkg      = format.zip
# FreeDOS kernel source on GitHub (for boot sector ASM)
# boot.asm handles FAT12 and FAT16; replaces the old fat12.asm/fat16.asm split
kernel_src_url  = https://raw.githubusercontent.com/FDOS/kernel/master/boot/boot.asm

[jemmex]
# Hardcoded to latest known-good release (v5.86, 2026-01-25)
# Update version and archive_name together when upgrading
version         = v5.86
archive_name    = JemmB_v586.zip
url             = https://github.com/Baron-von-Riedesel/Jemm/releases/download/v5.86/JemmB_v586.zip

[ctmouse]
# CuteMouse from ibiblio FreeDOS 1.3 repositories
url             = https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/repositories/1.3/base/ctmouse.zip

[mtcp]
# mTCP from brutman.com — update date string when a new release ships
url             = https://www.brutman.com/mTCP/download/mTCP_2025-01-10.zip

[qemu]
binary          = qemu-system-i386
boot_timeout_s  = 10
serial_port     = stdio
